<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Sweep</title>
  <link rel="manifest" href="Manifest.webmanifest">
  <meta name="theme-color" content="#22d3ee">
  <style>
    :root {
      --bg:#050816;
      --panel:#0d1329;
      --line:#243255;
      --text:#e6f2ff;
      --muted:#8ca4c7;
      --accent:#22d3ee;
      --safe:#34d399;
      --mine:#fb7185;
      --warn:#fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(circle at top, #13234b, var(--bg) 52%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .app {
      width:min(760px,100%);
      background:linear-gradient(180deg, #111a36, #0b1227);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      padding:16px;
    }
    .top {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .title { font-size:1.2rem; font-weight:700; letter-spacing:.3px; }
    .title span { color:var(--accent); }
    .controls { display:flex; gap:8px; flex-wrap:wrap; }
    button, select {
      background:#111b35;
      color:var(--text);
      border:1px solid #2f426d;
      border-radius:10px;
      padding:8px 11px;
      font-weight:600;
    }
    button.primary { background:linear-gradient(180deg, #22d3ee, #0891b2); border:none; color:#082f49; }
    .hud { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
    .stat {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 10px;
      text-align:center;
    }
    .stat b { display:block; font-size:1.2rem; }
    #board {
      display:grid;
      gap:6px;
      user-select:none;
      touch-action:none;
    }
    .cell {
      aspect-ratio:1/1;
      border-radius:8px;
      border:1px solid #334a79;
      background:linear-gradient(180deg,#1a2a51,#152244);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      cursor:pointer;
      transition:transform .06s ease, filter .15s ease;
      font-size:clamp(12px,2.4vw,18px);
    }
    .cell:active { transform:scale(.96); }
    .revealed {
      background:linear-gradient(180deg,#0f1a37,#0d1732);
      border-color:#253a61;
      cursor:default;
    }
    .mine { background:linear-gradient(180deg,#4a1a2a,#32111d); border-color:#7d2942; }
    .flagged { color:var(--warn); }
    .n1{color:#7dd3fc}.n2{color:#86efac}.n3{color:#fca5a5}.n4{color:#c4b5fd}
    .n5{color:#fda4af}.n6{color:#5eead4}.n7{color:#fde68a}.n8{color:#e9d5ff}
    .status { margin-top:12px; color:var(--muted); font-size:.95rem; min-height:24px; }
    .status.win { color:var(--safe); }
    .status.lose { color:var(--mine); }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="title">💣 <span>Neon Sweep</span> — modern minesweeper</div>
      <div class="controls">
        <select id="difficulty">
          <option value="9x9x10">Easy 9x9 (10 mines)</option>
          <option value="12x12x22" selected>Medium 12x12 (22 mines)</option>
          <option value="16x16x45">Hard 16x16 (45 mines)</option>
        </select>
        <button id="restart" class="primary">New Round</button>
      </div>
    </div>

    <div class="hud">
      <div class="stat">Mines Left <b id="minesLeft">0</b></div>
      <div class="stat">Time <b id="timer">0</b></div>
      <div class="stat">Revealed <b id="revealed">0</b></div>
    </div>

    <div id="board" aria-label="game board"></div>
    <div id="status" class="status">Left click to reveal, right click to flag. First click is always safe.</div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const minesLeftEl = document.getElementById('minesLeft');
    const timerEl = document.getElementById('timer');
    const revealedEl = document.getElementById('revealed');
    const difficultyEl = document.getElementById('difficulty');

    let rows, cols, mineCount, board, started, gameOver, revealedCount, flags, timer, interval;

    function init() {
      [rows, cols, mineCount] = difficultyEl.value.split('x').map(Number);
      board = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({
        mine:false, revealed:false, flagged:false, adjacent:0
      })));
      started = false;
      gameOver = false;
      revealedCount = 0;
      flags = 0;
      timer = 0;
      clearInterval(interval);
      timerEl.textContent = '0';
      statusEl.textContent = 'Left click to reveal, right click to flag. First click is always safe.';
      statusEl.className = 'status';

      boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      boardEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.setAttribute('data-r', r);
          cell.setAttribute('data-c', c);
          cell.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
          cell.onclick = () => reveal(r, c);
          boardEl.appendChild(cell);
        }
      }
      updateHud();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < mineCount) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (board[r][c].mine || (r === safeR && c === safeC)) continue;
        board[r][c].mine = true;
        placed++;
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].mine) continue;
          board[r][c].adjacent = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
        }
      }
    }

    function neighbors(r, c) {
      const out = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push([nr, nc]);
        }
      }
      return out;
    }

    function reveal(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      if (!started) {
        placeMines(r, c);
        started = true;
        interval = setInterval(() => {
          timer++;
          timerEl.textContent = String(timer);
        }, 1000);
      }

      cell.revealed = true;
      revealedCount++;

      if (cell.mine) {
        lose();
        return;
      }

      if (cell.adjacent === 0) {
        for (const [nr, nc] of neighbors(r, c)) {
          if (!board[nr][nc].revealed) reveal(nr, nc);
        }
      }

      render();
      if (revealedCount === rows * cols - mineCount) win();
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      flags += cell.flagged ? 1 : -1;
      render();
    }

    function render() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const btn = boardEl.children[idx];
          const cell = board[r][c];
          btn.className = 'cell';
          btn.textContent = '';
          if (cell.revealed) {
            btn.classList.add('revealed');
            if (cell.mine) {
              btn.classList.add('mine');
              btn.textContent = '✹';
            } else if (cell.adjacent > 0) {
              btn.classList.add('n' + cell.adjacent);
              btn.textContent = String(cell.adjacent);
            }
          } else if (cell.flagged) {
            btn.classList.add('flagged');
            btn.textContent = '⚑';
          }
        }
      }
      updateHud();
    }

    function updateHud() {
      minesLeftEl.textContent = String(mineCount - flags);
      revealedEl.textContent = String(revealedCount);
    }

    function lose() {
      gameOver = true;
      clearInterval(interval);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].mine) board[r][c].revealed = true;
        }
      }
      render();
      statusEl.textContent = 'Boom! You hit a mine. Press New Round to try again.';
      statusEl.className = 'status lose';
    }

    function win() {
      gameOver = true;
      clearInterval(interval);
      statusEl.textContent = 'You cleared the board! Neon Sweep victory.';
      statusEl.className = 'status win';
    }

    document.getElementById('restart').addEventListener('click', init);
    difficultyEl.addEventListener('change', init);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./Service-worker.js'));
    }

    init();
  </script>
</body>
</html>
